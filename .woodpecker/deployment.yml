steps:
  - name: Preconfigure
    image: node
    commands:
      - npm ci

  - name: Build
    image: node
    commands:
      - npm run build

  - name: prepare-deploy
    image: node:20
    commands:
      - mkdir deploy
      - cp -r .next public package.json package-lock.json deploy/
  
  - name: compress
    image: node:20
    commands:
      - tar -czf hackzogtum-webpage.tar.gz deploy/

when:
  - branch: main